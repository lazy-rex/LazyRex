# The release build: a push of a vX.Y.Z tag (or vX.Y.Z-rc.N, a prerelease) builds the archives with
# scripts/release-build.sh, checks them, runs each archive on a runner of its own system, and makes
# the GitHub release of that tag with them. The coordinator makes the tags. CI is a build service:
# nothing of LazyRex runs it.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.check.outputs.commit }}
    steps:
      # The exact tag: go build stamps vcs.revision from the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: hub/go.mod
          cache: false
      - name: Vet
        run: |
          scripts/check-action-pins.sh
          (cd hub && go vet ./...)
          (cd view && go vet ./...)
          scripts/release-build-test.sh
          scripts/install-test.sh
      # Outside the checkout, so the build of each target sees a clean tree.
      - name: Build
        run: scripts/release-build.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/dist"
      # Each archive: the checksum, the layout, and the stamp of the checked-out commit, not modified.
      - name: Check
        id: check
        run: |
          commit=$(git rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          # The archive list: the binaries, the license and every top-level .lua file of sdk/lua.
          want=$( (printf '%s\n' bin/lazyrex-hub bin/lazyrex-view doc/LICENSE; for f in sdk/lua/*.lua; do echo "$f"; done) | LC_ALL=C sort | tr '\n' ' ')
          cd "$RUNNER_TEMP/dist"
          sha256sum -c SHA256SUMS
          for a in lazyrex-"$GITHUB_REF_NAME"-*.tar.gz; do
            test "$(tar -tzf "$a" | grep -v '/$' | LC_ALL=C sort | tr '\n' ' ')" = "$want"
            d=$(mktemp -d)
            tar -xzf "$a" -C "$d"
            for b in "$d"/bin/*; do
              go version -m "$b" | grep -qx "	build	vcs.revision=$commit"
              go version -m "$b" | grep -qx "	build	vcs.modified=false"
            done
          done
      # The install script of this tag goes beside the archives (not in SHA256SUMS: a user runs it
      # before any check). The README installs with releases/latest/download/install.sh.
      - name: Install script
        run: cp scripts/install.sh "$RUNNER_TEMP/dist/install.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist
          if-no-files-found: error

  # Each archive runs on a runner of its own OS and architecture: the binaries start, and they print
  # the tag and the commit.
  smoke:
    needs: build
    strategy:
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Version
        env:
          OS: ${{ matrix.os }}
          COMMIT: ${{ needs.build.outputs.commit }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          test -n "$COMMIT"
          test "$(uname -s | tr A-Z a-z)" = "$OS"
          case $(uname -m) in x86_64) m=amd64 ;; aarch64 | arm64) m=arm64 ;; *) m=$(uname -m) ;; esac
          test "$m" = "$ARCH"
          archive=lazyrex-$GITHUB_REF_NAME-$OS-$ARCH.tar.gz
          cd dist
          grep " $archive\$" SHA256SUMS > check
          if command -v sha256sum > /dev/null; then sha256sum -c check; else shasum -a 256 -c check; fi
          d=$(mktemp -d)
          tar -xzf "$archive" -C "$d"
          test "$("$d"/bin/lazyrex-hub version)" = "$GITHUB_REF_NAME (commit $COMMIT)"
          test "$("$d"/bin/lazyrex-view -version)" = "$GITHUB_REF_NAME"
      # The install script installs this archive into an empty HOME, from a file:// copy of the
      # release layout.
      - name: Install
        env:
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -eu
          rel=$(mktemp -d)
          mkdir -p "$rel/download/$GITHUB_REF_NAME"
          cp dist/lazyrex-"$GITHUB_REF_NAME"-*.tar.gz dist/SHA256SUMS "$rel/download/$GITHUB_REF_NAME/"
          home=$(mktemp -d)
          HOME=$home LAZYREX_BASE=file://$rel LAZYREX_VERSION=$GITHUB_REF_NAME LAZYREX_SETUP=0 sh dist/install.sh
          test "$("$home"/.lazyrex/bin/lazyrex-hub version)" = "$GITHUB_REF_NAME (commit $COMMIT)"

  release:
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release and its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=
          case $GITHUB_REF_NAME in *-rc.*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/lazyrex-"$GITHUB_REF_NAME"-*.tar.gz dist/SHA256SUMS dist/install.sh \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes "LazyRex $GITHUB_REF_NAME" $pre
